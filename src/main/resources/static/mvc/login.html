<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Login</title></head>
<body style="font-family:Arial;padding:20px;">
<h2>Login</h2>
<form id="loginForm">
    <input type="text" id="username" placeholder="Username" required><br><br>
    <input type="password" id="password" placeholder="Password" required><br><br>
    <button type="submit">Login</button>
</form>
<div id="error" style="color:red"></div>
<script>
    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const body = {username: username.value, password: password.value};
        const res = await fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
        if (!res.ok) { document.getElementById('error').innerText = 'Invalid credentials'; return; }
        localStorage.setItem('auth', JSON.stringify(await res.json()));
        location.href = '/mvc/index.html';
    }
</script>
</body></html>
