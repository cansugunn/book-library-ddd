<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Book details</title></head>
<body style="font-family:Arial;padding:20px;">
<a href="/mvc/index.html">← Back to books</a>
<h2 id="title"></h2>
<div id="meta"></div>
<h3>Ratings and comments from users</h3>
<ul id="comments"></ul>
<script>
const auth = JSON.parse(localStorage.getItem('auth') || 'null');
if (!auth) location.href = '/mvc/login.html';
const bookId = new URLSearchParams(location.search).get('bookId');
(async () => {
    const headers = {'Authorization': `Bearer ${auth.token}`};
    const bookRes = await fetch(`/api/books/${bookId}`, {headers});
    const b = await bookRes.json();
    title.innerText = b.title;
    meta.innerHTML = `Author: <a href='/mvc/user.html?label=author&name=${encodeURIComponent(b.authorName + ' ' + b.authorSurname)}'>${b.authorName} ${b.authorSurname}</a><br/>${b.about || ''}`;

    const favRes = await fetch('/api/user-book-states/favourites', {headers});
    const favs = favRes.ok ? await favRes.json() : [];
    const related = favs.filter(x => String(x.bookId) === String(bookId));
    comments.innerHTML = related.length
      ? related.map(x => `<li>User rating: ${x.rating ?? '-'}<ul>${(x.comments || []).map(c => `<li><a href='/mvc/user.html?label=comment&name=${encodeURIComponent(c)}'>${c}</a></li>`).join('')}</ul></li>`).join('')
      : '<li>No comments visible for current user scope.</li>';
})();
</script>
</body></html>
