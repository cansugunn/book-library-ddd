<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.title}"></title>
    <link rel="stylesheet/less" type="text/css" href="/resources/less/mvc.less" />
    <script src="https://cdn.jsdelivr.net/npm/less@4"></script>
</head>
<body>
<header class="nav-shell compact">
    <div class="logo">Bookverse</div>
    <form class="search" method="get" th:action="@{/mvc/books}">
        <input name="q" th:value="${keyword}" placeholder="Search for stories, authors, or titles"/>
    </form>

    <nav class="nav-actions" sec:authorize="isAnonymous()">
        <a th:href="@{/mvc/login}">Login</a>
        <a class="cta" th:href="@{/mvc/login}">Sign Up</a>
    </nav>


    <nav class="nav-actions" sec:authorize="isAuthenticated()">
        <a th:href="@{/mvc/users/me}">
            <span sec:authentication="name"></span>
        </a>
        <a th:href="@{/mvc/logout}">Logout</a>
    </nav>
</header>

<section class="book-hero">
    <img class="book-hero-cover" th:src="@{/mvc/media/cover(path=${book.coverPath})}" alt="cover"/>
    <div class="book-hero-copy">
        <h1 th:text="${book.title}"></h1>
        <p class="meta" th:text="${book.authorName + ' ' + book.authorSurname + ' · ' + book.year + ' · ' + book.numberOfPages + ' pages'}"></p>
        <p th:text="${book.about}"></p>
        <div class="stats-row">
            <div>
                <span>Lecturas</span>
                <strong th:text="${statistics.totalReads}"></strong>
            </div>

            <div>
                <span>Votos</span>
                <strong th:text="${statistics.averageRating}"></strong>
            </div>

            <div>
                <span>Comentarios</span>
                <strong th:text="${statistics.commentsCount}"></strong>
            </div>
        </div>
    </div>
</section>

<section class="section detail-grid">
    <div class="card">
        <h2>Rate & comments</h2>
        <div th:if="${bookState != null}">
            <p>Tu calificación: <strong th:text="${bookState.rating != null ? bookState.rating : 'Not rated'}"></strong></p>
            <ul class="comment-list" th:if="${bookState.comments != null && !bookState.comments.isEmpty()}">
                <li th:each="comment : ${bookState.comments}">
                    <a th:href="@{/mvc/users/me/comments}" th:text="${comment}"></a>
                </li>
            </ul>
            <p th:if="${bookState.comments == null || bookState.comments.isEmpty()}">There are no saved comments for this book yet.</p>
        </div>
        <div th:if="${bookState == null}">
            <p>Log in to view and manage your reading ratings/comments.</p>
            <a class="hero-btn" th:href="@{/mvc/login}">Go to login</a>
        </div>
    </div>
</section>
</body>
</html>
