<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookverse</title>
    <link rel="stylesheet/less" type="text/css" href="/resources/less/mvc.less"/>
    <script src="https://cdn.jsdelivr.net/npm/less@4"></script>
</head>
<body>
<header class="nav-shell">
    <div class="logo">Bookverse</div>
    <form class="search" method="get" th:action="@{/mvc/books}">
        <input name="q" th:value="${keyword}" placeholder="Buscar historias, autores o títulos"/>
    </form>

    <nav class="nav-actions" sec:authorize="isAnonymous()">
        <a th:href="@{/mvc/login}">Iniciar sesión</a>
        <a class="cta" th:href="@{/mvc/login}">Regístrate</a>
    </nav>


    <nav class="nav-actions" sec:authorize="isAuthenticated()">
        <a th:href="@{/mvc/users/me}">
            <span sec:authentication="name"></span>
        </a>
        <a th:href="@{/mvc/logout}">Logout</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-copy">
        <h1>Ven por la historia. Quédate por la conexión.</h1>
        <p>Explora historias modernas con carrusel en vivo y catálogo paginado. Los visitantes pueden navegar
            libremente, el perfil desbloquea favoritos y comentarios.</p>
        <a class="hero-btn" th:href="@{/mvc/login}" sec:authorize="isAnonymous()">Comenzar</a>
        <a class="hero-btn" th:href="@{/mvc/users/me/favourites}" sec:authorize="isAuthenticated()">Mis favoritos</a>
    </div>
    <div class="hero-art">
        <div class="wave"></div>
        <div class="bubble" th:each="book : ${baseBooks}">
            <img th:src="@{/mvc/media/cover(path=${book.coverPath})}"/>
            <div>
                <strong th:text="${book.title}"></strong>
                <small th:text="|${book.authorName} ${book.authorSurname}|"></small>
            </div>
        </div>
    </div>
</section>

<section class="section">
    <div class="section-head"><h2>Trending now</h2></div>
    <div class="carousel-viewport">
        <div class="carousel-track">
            <a class="story-card" th:each="book : ${trendingBooks}" th:href="@{/mvc/books/{id}(id=${book.bookId})}">
                <img th:src="@{/mvc/media/cover(path=${book.coverPath})}" alt="cover"/>
                <h3 th:text="${book.title}"></h3>
                <p th:text="|${book.authorName} ${book.authorSurname}|"></p>
            </a>
        </div>
    </div>
</section>

</body>
</html>
