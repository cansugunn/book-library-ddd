<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mvc/fragments/layout :: head('Login')}"></head>
<body>
<div class="main-shell">
<header class="nav-shell compact">
    <div class="logo">Bookverse</div>
    <nav class="nav-actions"><a th:href="@{/mvc}">Explore</a></nav>
</header>
<div class="page">
    <div class="card login-card modern">
        <h2>Welcome back</h2>
        <p class="subtitle">Continue your reading journey</p>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/mvc/login}" method="post">
            <label>Username <input type="text" name="username" required></label>
            <label>Password <input type="password" name="password" required></label>
            <button type="submit">Sign in</button>
        </form>
    </div>
</div>
<footer th:replace="~{mvc/fragments/layout :: footer}"></footer>
</div>
</body>
</html>
