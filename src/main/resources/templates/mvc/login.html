<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet/less" type="text/css" href="/resources/less/mvc.less" />
    <script src="https://cdn.jsdelivr.net/npm/less@4"></script>
</head>
<body>

<header class="nav-shell compact">
    <div class="logo">Bookverse</div>
    <nav class="nav-actions"><a th:href="@{/mvc/home}">Explore</a></nav>
</header>

<div class="page">
    <div class="card login-card modern">
        <h2>Welcome back</h2>
        <p class="subtitle">Continue your reading journey</p>
        <p class="error" th:if="${session['SPRING_SECURITY_LAST_EXCEPTION']?.message}" th:text="${session['SPRING_SECURITY_LAST_EXCEPTION'].message}"></p>
        <form th:action="@{/mvc/login}" method="post">
            <label>Username <input type="text" name="username" required></label>
            <label>Password <input type="password" name="password" required></label>
            <button type="submit">Sign in</button>
        </form>
    </div>
</div>
</body>
</html>
