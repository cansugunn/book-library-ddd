<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User profile</title>
    <link rel="stylesheet/less" type="text/css" href="/resources/less/mvc.less" />
    <script src="https://cdn.jsdelivr.net/npm/less@4"></script>
</head>
<body>
<header class="nav-shell compact">
    <div class="logo">Bookverse</div>
    <nav class="nav-actions">
        <a th:href="@{/mvc}">Explorar</a>
        <a th:href="@{/mvc/users/me/comments}">Mis comentarios</a>
        <a th:href="@{/mvc/logout}">Salir</a>
    </nav>
</header>
<div class="page">
    <div class="card">
        <h2 th:text="${#authentication.principal.username}"></h2>
        <p>
            User type:
            <strong th:text="${#authentication.principal.userType}"></strong>
        </p>
    </div>

    <div class="section-head"><h2>Mis favoritos</h2></div>
    <div class="carousel">
        <a class="story-card" th:each="fav : ${favourites}" th:href="@{/mvc/books/{id}(id=${fav.bookId})}">
            <img th:src="${fav.coverPath}" alt="cover"/>
            <h3 th:text="${fav.title}"></h3>
            <p th:text="${'⭐ ' + (fav.rating != null ? fav.rating : 0) + ' · ' + (#lists.size(fav.comments)) + ' comentarios'}"></p>
        </a>
    </div>
</div>
</body>
</html>
