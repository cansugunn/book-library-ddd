<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mvc/fragments/layout :: head('User profile')}"></head>
<body>
<div class="main-shell">
<header class="nav-shell compact">
    <div class="logo">Bookverse</div>
    <nav class="nav-actions">
        <a th:href="@{/mvc}">Explorar</a>
        <a th:href="@{/mvc/users/me/comments}">Mis comentarios</a>
        <a th:href="@{/mvc/logout}">Salir</a>
    </nav>
</header>
<div class="page">
    <div class="card">
        <h2 th:text="${user.username}"></h2>
        <p class="profile-meta">User type: <strong th:text="${user.userType}"></strong></p>
    </div>

    <div class="section-head"><h2>Mis favoritos</h2></div>
    <div class="carousel">
        <a class="story-card" th:each="fav : ${favourites}" th:href="@{/mvc/books/{id}(id=${fav.bookId})}">
            <img th:src="${fav.coverPath}" alt="cover"/>
            <h3 th:text="${fav.title}"></h3>
            <p th:text="${'⭐ ' + (fav.rating != null ? fav.rating : 0) + ' · ' + (#lists.size(fav.comments)) + ' comentarios'}"></p>
        </a>
    </div>
</div>
<footer th:replace="~{mvc/fragments/layout :: footer}"></footer>
</div>
</body>
</html>
