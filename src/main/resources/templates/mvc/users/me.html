<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User profile</title>
    <link rel="stylesheet/less" type="text/css" href="/resources/less/mvc.less" />
    <script src="https://cdn.jsdelivr.net/npm/less@4"></script>
</head>
<body>
<div class="topbar">
    <div class="brand">Book Library</div>
    <div class="actions">
        <a th:href="@{/mvc/books}">Books</a>
        <a th:href="@{/mvc/logout}">Logout</a>
    </div>
</div>
<div class="page">
    <div class="card">
        <h2 th:text="${user.username}"></h2>
        <p>User type: <strong th:text="${user.userType}"></strong></p>
        <p><a th:href="@{/mvc/users/me/comments}">My comments</a></p>
        <h3>My favourites</h3>
        <ul>
            <li th:each="fav : ${favourites}">
                <a th:href="@{/mvc/books/{id}(id=${fav.bookId})}" th:text="${fav.title}"></a>
            </li>
        </ul>
    </div>
</div>
</body>
</html>
