<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mvc/fragments/layout :: head('Mis comentarios')}"></head>
<body>
<div class="main-shell">
<header class="nav-shell compact">
    <div class="logo">Bookverse</div>
    <nav class="nav-actions">
        <a th:href="@{/mvc/users/me}">Perfil</a>
        <a th:href="@{/mvc}">Explorar</a>
    </nav>
</header>
<div class="page">
    <h2>Mis comentarios</h2>
    <p class="subtitle">Resumen de tus opiniones en libros favoritos</p>
    <div class="card" th:if="${commentStates.isEmpty()}">
        <p>No tienes comentarios todavía.</p>
    </div>
    <div class="card comment-card" th:each="item : ${commentStates}">
        <div class="comment-header">
            <a th:href="@{/mvc/books/{id}(id=${item.bookId})}" th:text="${item.title}"></a>
            <strong th:text="${'⭐ ' + (item.rating != null ? item.rating : 0)}"></strong>
        </div>
        <ul class="comment-list">
            <li th:each="comment : ${item.comments}" th:text="${comment}"></li>
        </ul>
    </div>
</div>
<footer th:replace="~{mvc/fragments/layout :: footer}"></footer>
</div>
</body>
</html>
