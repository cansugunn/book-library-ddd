<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My comments</title>
    <link rel="stylesheet/less" type="text/css" href="/resources/less/mvc.less" />
    <script src="https://cdn.jsdelivr.net/npm/less@4"></script>
</head>
<body>
<header class="nav-shell compact">
    <div class="logo">Bookverse</div>
    <nav class="nav-actions">
        <a th:href="@{/mvc/users/me}">Profile</a>
        <a th:href="@{/mvc}">Explore</a>
    </nav>
</header>
<div class="page">
    <h2>Mis comentarios</h2>
    <p class="subtitle">Summary of your opinions on favorite books</p>
    <div class="card" th:if="${commentStates.isEmpty()}">
        <p>You have no comments yet.</p>
    </div>
    <div class="card" th:each="item : ${commentStates}">
        <div class="comment-header">
            <a th:href="@{/mvc/books/{id}(id=${item.bookId})}" th:text="${item.title}"></a>
            <strong th:text="${'⭐ ' + (item.rating != null ? item.rating : 0)}"></strong>
        </div>
        <ul class="comment-list">
            <li th:each="comment : ${item.comments}" th:text="${comment}"></li>
        </ul>
    </div>
</div>
</body>
</html>
